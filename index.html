<style>
:root{
  color-scheme:dark;
  --ink:#E4FFEF;--ink-soft:#9BC9AE;--ink-faint:#5E8B71;
  --bg:#050C08;--surface:#0B1710;--surface-alt:#10221A;
  --accent:#39FF88;--accent-dark:#1FD66A;--accent-bg:rgba(57,255,136,.12);--on-accent:#03140A;
  --positive:#34E39B;--positive-bg:rgba(52,227,155,.13);
  --info:#4DD7FF;--info-bg:rgba(77,215,255,.13);
  --danger:#FF5C7A;--danger-bg:rgba(255,92,122,.14);
  --warning:#FFD23F;--warning-bg:rgba(255,210,63,.13);
  --border:#1A3A29;--border-soft:#12281D;
  --glow:0 0 0 1px rgba(57,255,136,.35),0 0 18px rgba(57,255,136,.28);
  --radius-sm:6px;--radius:12px;--radius-lg:18px;
  --shadow:0 2px 12px rgba(0,0,0,.45);
  --shadow-lg:0 16px 40px rgba(0,0,0,.6);
  --font-display:'Space Grotesk', sans-serif;--font-body:'Inter', sans-serif;--font-mono:'JetBrains Mono', monospace;
  --sidebar-w:264px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(900px 420px at 85% -10%,rgba(57,255,136,.07),transparent 60%);background-attachment:fixed;}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink);margin:0 0 4px;font-weight:600;}
p{margin:0;}
button{font-family:var(--font-body);cursor:pointer;}
input,select,textarea{font-family:var(--font-body);color-scheme:dark;}
select option{background:#0B1710;color:#E4FFEF;}
a{color:inherit;}
::selection{background:var(--accent);color:var(--on-accent);}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
::-webkit-scrollbar{width:9px;height:9px;}::-webkit-scrollbar-thumb{background:#1D4B33;border-radius:9px;}::-webkit-scrollbar-track{background:transparent;}

.eartag{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12.5px;font-weight:600;background:var(--surface-alt);color:var(--accent);border:1px solid var(--border);padding:3px 9px 3px 6px;border-radius:5px 5px 5px 5px / 8px 8px 5px 5px;white-space:nowrap;}
.eartag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--bg);border:1px solid var(--accent);flex:none;}

/* ===== BANNER ===== */
.banner{position:relative;width:100%;height:150px;overflow:hidden;background:linear-gradient(120deg,#07150D 0%,#0E2C1B 55%,#0A1F14 100%);border-bottom:1px solid var(--border);}
.banner img{width:100%;height:100%;object-fit:cover;display:block;}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(5,12,8,.75));pointer-events:none;}
.banner .banner-fallback{position:absolute;inset:0;display:none;align-items:center;padding:0 28px;gap:14px;z-index:1;}
.banner .banner-fallback .mk{width:52px;height:52px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:22px;box-shadow:var(--glow);}
.banner .banner-fallback .tx{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--ink);text-shadow:0 0 18px rgba(57,255,136,.55);}
.banner .banner-fallback .tx small{display:block;font-family:var(--font-body);font-size:12.5px;font-weight:500;color:var(--ink-soft);text-shadow:none;}
.banner.noimg .banner-fallback{display:flex;}
.banner.noimg img{display:none;}
@media(max-width:980px){.banner{height:110px;}}

/* ===== LOGIN ===== */
#screen-login{min-height:100vh;display:flex;flex-direction:column;align-items:center;background:radial-gradient(700px 360px at 15% 0%,rgba(57,255,136,.14),transparent 60%),var(--bg);}
#screen-login .banner{border-bottom:1px solid var(--border);}
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;padding:24px;}
.login-card{width:100%;max-width:410px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg),0 0 40px rgba(57,255,136,.08);padding:34px 30px;}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.login-brand .mark{width:40px;height:40px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--on-accent);font-family:var(--font-display);font-weight:700;font-size:19px;box-shadow:var(--glow);}
.login-brand .name{font-family:var(--font-display);font-size:19px;font-weight:600;}
.login-brand .name span{display:block;font-family:var(--font-body);font-size:11.5px;color:var(--ink-faint);font-weight:500;}
.login-card h1{font-size:22px;margin-bottom:6px;}
.login-sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:22px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field select,.field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-alt);font-size:14px;color:var(--ink);}
.role-picker{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.role-opt{border:1.5px solid var(--border);border-radius:var(--radius);padding:12px 10px;text-align:center;background:var(--surface-alt);transition:.15s;cursor:pointer;}
.role-opt.active{border-color:var(--accent);background:var(--accent-bg);box-shadow:var(--glow);}
.role-opt .ic{font-size:20px;display:block;margin-bottom:4px;}
.role-opt .lbl{font-weight:700;font-size:13.5px;}
.role-opt .sub{font-size:11px;color:var(--ink-faint);}
.btn-primary{width:100%;padding:12px;background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--radius-sm);font-weight:800;font-size:14.5px;box-shadow:0 0 18px rgba(57,255,136,.35);}
.btn-primary:hover{background:#6BFFA6;}
.btn-primary[disabled]{opacity:.6;cursor:wait;}

/* ===== SHELL ===== */
#app{display:none;}#app.on{display:block;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:var(--sidebar-w);flex:none;background:linear-gradient(180deg,#07130C 0%,#050C08 100%);color:var(--ink-soft);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;padding:18px 12px;z-index:40;border-right:1px solid var(--border);overflow-y:auto;}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;}
.sidebar .brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--on-accent);font-family:var(--font-display);font-weight:700;font-size:16px;flex:none;box-shadow:var(--glow);}
.sidebar .brand .name{font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--ink);}
.sidebar .brand .name span{display:block;font-family:var(--font-body);font-size:10.5px;font-weight:500;color:var(--ink-faint);}
.grouplbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:700;padding:14px 10px 6px;}
.navlink{position:relative;display:block;height:78px;border-radius:12px;overflow:hidden;margin-bottom:8px;border:1px solid var(--border);background:var(--surface-alt);text-decoration:none;color:#fff;transition:.15s;flex:none;}
.navlink .navimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--surface-alt);}
.navlink .navimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s,filter .25s;filter:brightness(.82) saturate(1.05);}
.navlink::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(2,10,5,.88) 100%);pointer-events:none;}
.navlink .navlbl{position:absolute;left:10px;right:10px;bottom:6px;z-index:2;font-size:11px;font-weight:700;line-height:1.15;letter-spacing:.01em;color:#F2FFF7;text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.navlink:hover{border-color:rgba(57,255,136,.6);}
.navlink:hover .navimg img{transform:scale(1.05);filter:brightness(1) saturate(1.1);}
.navlink.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 18px rgba(57,255,136,.45);}
.navlink.active .navimg img{filter:brightness(1);}
.navlink.active .navlbl{color:var(--accent);}
.sidebar-foot{margin-top:auto;padding:12px 8px 4px;border-top:1px solid var(--border);}
.userchip{display:flex;align-items:center;gap:9px;padding:6px;}
.userchip .av{width:32px;height:32px;border-radius:50%;background:var(--accent-bg);border:1px solid var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex:none;}
.userchip .who .n{font-size:12.5px;font-weight:700;color:var(--ink);}
.userchip .who .r{font-size:10.5px;color:var(--ink-faint);}
.logout-btn{background:none;border:none;color:var(--ink-faint);font-size:11.5px;margin-top:8px;padding:4px 6px;text-decoration:underline;}
.logout-btn:hover{color:var(--accent);}

.main{margin-left:var(--sidebar-w);flex:1;min-width:0;padding-bottom:70px;}
.topbar{position:sticky;top:0;z-index:30;background:rgba(5,12,8,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid var(--border);}
.hamburger{display:none;border:1px solid var(--border);background:var(--surface);color:var(--ink);width:38px;height:38px;border-radius:9px;font-size:16px;}
.searchbar{flex:1;max-width:400px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;}
.searchbar:focus-within{border-color:var(--accent);box-shadow:0 0 12px rgba(57,255,136,.25);}
.searchbar input{border:none;background:none;outline:none;font-size:13.5px;flex:1;color:var(--ink);}
.searchbar input::placeholder{color:var(--ink-faint);}
.searchbar .ic{color:var(--ink-faint);font-size:13px;}
.search-results{position:absolute;top:56px;left:28px;right:28px;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:50;max-height:320px;overflow:auto;display:none;}
.search-results.show{display:block;}
.search-results .sr-item{padding:10px 14px;border-bottom:1px solid var(--border-soft);cursor:pointer;font-size:13px;}
.search-results .sr-item:hover{background:var(--accent-bg);}
.search-results .sr-empty{padding:14px;color:var(--ink-faint);font-size:12.5px;}
.topbar-spacer{flex:1;}
.bell{position:relative;background:var(--surface);color:var(--ink);border:1px solid var(--border);width:38px;height:38px;border-radius:9px;font-size:15px;}
.bell:hover{border-color:var(--accent);}
.bell .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:1.5px solid var(--bg);box-shadow:0 0 8px var(--danger);}
.role-badge{font-size:11px;font-weight:700;background:var(--accent-bg);color:var(--accent);border:1px solid rgba(57,255,136,.4);padding:5px 10px;border-radius:20px;}

.content{padding:22px 28px 40px;max-width:1180px;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.page-head h1{font-size:26px;}
.page-head .sub{color:var(--ink-soft);font-size:13.5px;margin-top:2px;}
.breadcrumb{font-size:12px;color:var(--ink-faint);margin-bottom:6px;}
.breadcrumb a{color:var(--ink-soft);text-decoration:none;}
.breadcrumb a:hover{color:var(--accent);}

.btn{border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-alt);color:var(--ink);padding:9px 16px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;text-decoration:none;transition:.15s;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:800;box-shadow:0 0 14px rgba(57,255,136,.3);}
.btn-acc:hover{background:#6BFFA6;border-color:#6BFFA6;color:var(--on-accent);}
.btn-danger{background:var(--danger-bg);border-color:rgba(255,92,122,.4);color:var(--danger);}
.btn-danger:hover{background:var(--danger);color:#1A0308;border-color:var(--danger);}
.btn-ghost{background:none;border-color:transparent;}
.btn-ghost:hover{background:var(--surface-alt);border-color:var(--border);color:var(--ink);}
.btn-sm{padding:6px 11px;font-size:12px;}

.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:1fr 1fr;}
@media(max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.kpi .lbl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:8px;}
.kpi .val{font-family:var(--font-display);font-size:29px;font-weight:600;color:var(--ink);line-height:1.1;}
.kpi .val small{font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--ink-soft);}
.kpi .delta{font-size:12px;margin-top:6px;font-weight:600;color:var(--ink-faint);}
.grid-4>.kpi:first-child .val{color:var(--accent);text-shadow:0 0 18px rgba(57,255,136,.45);}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;}
.tag.positive{background:var(--positive-bg);color:var(--positive);}
.tag.info{background:var(--info-bg);color:var(--info);}
.tag.danger{background:var(--danger-bg);color:var(--danger);}
.tag.warning{background:var(--warning-bg);color:var(--warning);}
.tag.neutral{background:var(--surface-alt);color:var(--ink-soft);}

.sec-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;}
.sec-title h2{font-size:17px;padding-left:10px;border-left:3px solid var(--accent);}

.charts-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:14px;}
@media(max-width:980px){.charts-grid{grid-template-columns:1fr;}}
.chart-card h3{font-size:13.5px;margin-bottom:2px;}
.chart-card .sub{font-size:11.5px;color:var(--ink-faint);margin-bottom:10px;}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;}
.legend span{display:inline-flex;align-items:center;gap:5px;color:var(--ink-soft);font-weight:600;}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}

.alert-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-soft);margin-bottom:8px;background:var(--surface-alt);}
.alert-item .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--warning);box-shadow:0 0 8px var(--warning);}
.alert-item .txt{flex:1;font-size:13px;}
.alert-item .cnt{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);}
.empty-alerts{color:var(--ink-faint);font-size:13px;padding:12px 4px;}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.filters select,.filters input{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:12.5px;color:var(--ink);}
.filters .fsearch{position:relative;flex:1;min-width:160px;}
.filters .fsearch input{width:100%;}
.filter-reset{font-size:12px;color:var(--accent);text-decoration:underline;background:none;border:none;padding:6px;}

.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);padding:11px 14px;border-bottom:1px solid var(--border);background:var(--surface-alt);font-weight:700;white-space:nowrap;}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(57,255,136,.05);}
.tbl-actions{display:flex;gap:6px;}
.icbtn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--surface-alt);font-size:13px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);}
.icbtn:hover{border-color:var(--accent);}
.icbtn.danger:hover{background:var(--danger-bg);border-color:var(--danger);}
.mono{font-family:var(--font-mono);}
.tright{text-align:right;}
.empty-row td{text-align:center;color:var(--ink-faint);padding:34px;font-size:13px;}

.modal-bg{position:fixed;inset:0;background:rgba(0,4,2,.72);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);max-width:560px;width:100%;max-height:92vh;overflow:auto;box-shadow:var(--shadow-lg),0 0 30px rgba(57,255,136,.1);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:var(--surface);z-index:2;}
.modal-head h3{font-size:17px;}
.modal-close{background:none;border:none;font-size:19px;color:var(--ink-faint);width:30px;height:30px;}
.modal-close:hover{color:var(--accent);}
.modal-body{padding:20px 22px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border-soft);position:sticky;bottom:0;background:var(--surface);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:480px){.form-row{grid-template-columns:1fr;}}
.f{margin-bottom:14px;}
.f label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
.f .req{color:var(--danger);}
.f input,.f select,.f textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13.5px;color:var(--ink);background:var(--surface-alt);}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 10px rgba(57,255,136,.25);outline:none;}
.f textarea{resize:vertical;min-height:60px;}
.f .err{color:var(--danger);font-size:11.5px;margin-top:5px;display:none;font-weight:600;}
.f.invalid input,.f.invalid select,.f.invalid textarea{border-color:var(--danger);background:var(--danger-bg);}
.f.invalid .err{display:block;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;background:var(--surface);border:1px solid var(--accent);color:var(--ink);border-radius:var(--radius);box-shadow:var(--shadow-lg),0 0 22px rgba(57,255,136,.3);padding:16px 20px;min-width:280px;max-width:92vw;transition:.25s;}
@media(min-width:981px){.toast{left:calc(50% + var(--sidebar-w)/2);}}
@media(max-width:980px){.toast{bottom:88px;}}
.toast.hide{opacity:0;transform:translateX(-50%) translateY(12px);pointer-events:none;}

<script>
(function(){
"use strict";

/* ===== CONFIG ===== */
const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbykzkfbQD12BBBKHuxwl3HS8pDDhdDq0q873OM5zJFkpRsdxEAHtrI8ZWFvbAPnZ7U-/exec";
const RAZAS = ["Holstein","Jersey","Pardo Suizo","Gyr Lechero","Criolla"];
const USUARIOS = [
  {id:"u1", nombre:"Don Ramiro Pérez", rol:"propietario"},
  {id:"u2", nombre:"Juan Mamani", rol:"encargado"},
  {id:"u3", nombre:"Rosa Quispe", rol:"encargado"},
];
const VETERINARIOS = ["Dr. Álvaro Suárez","Dra. Lucía Rojas","Ing. Marcelo Zambrana"];
const TIPOS_EVENTO = ["Vacuna contra garrapata","Vitaminización","Tratamiento de mastitis","Lesión física","Otro evento sanitario"];

/* ===== IMÁGENES DEL MENÚ (carpeta /imagenes del repositorio) =====
   Si el nombre de algún archivo es distinto, cámbialo aquí. Si una imagen no carga, se muestra un emoji de respaldo. */
const CARPETA_IMG = "imagenes/";
const IMAGENES = {
  "#/dashboard":            "principalhero.webp",
  "#/hato":                 "registrodevaca.jpg",
  "#/produccion":           "registrodeproduccion.jpg",
  "#/produccion/historial": "registrodeproduccion.jpg",
  "#/pil":                  "entregaapil.jpg",
  "#/sanidad":              "registrarsanidad.webp",
  "#/sanidad/historial":    "registrarsanidad.webp",
  "#/terneraje":            "terneros.jpg"
  /* Reportes y Configuración no tienen imagen todavía: usan emoji.
     Cuando las subas, agrega aquí por ejemplo:  "#/reportes": "reportes.jpg",  "#/configuracion": "configuracion.jpg" */
};

let VACAS=[],PRODUCCION=[],ENTREGAS_PIL=[],EVENTOS_SANITARIOS=[],TERNEROS=[],PESAJES_TERNEROS=[];
let _id=1000;
function nextId(p){ _id++; return p+_id; }

function q(s,r){ return (r||document).querySelector(s); }
function qa(s,r){ return Array.from((r||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function fmtFecha(iso){ if(!iso) return "—"; const [y,m,d]=String(iso).split("-"); if(!y||!m||!d) return iso; return `${d}/${m}/${y}`; }
function edadDesde(iso){ if(!iso) return "—"; const d=Math.floor((new Date()-new Date(iso))/86400000); if(d<0) return "—"; if(d<30) return d+" días"; if(d<365) return Math.floor(d/30)+" meses"; return Math.floor(d/365)+" a"; }
function numLitros(n){ return (+n||0).toLocaleString("es-BO",{maximumFractionDigits:1})+" L"; }
function numBs(n){ return "Bs "+(+n||0).toLocaleString("es-BO",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function lblL(n){ return (Math.round(+n||0)).toLocaleString("es-BO"); }
function lblBs(n){ return (Math.round(+n||0)).toLocaleString("es-BO"); }
function vacaById(id){ return VACAS.find(v=>String(v.id)===String(id)); }
function terneroById(id){ return TERNEROS.find(t=>String(t.id)===String(id)); }

/* Imagen del menú con respaldo en emoji si el archivo no existe */
function imgMenu(ruta, emoji){
  const f = IMAGENES[ruta];
  if(!f) return esc(emoji);
  return `<img src="${CARPETA_IMG}${esc(f)}" alt="" loading="lazy" data-emoji="${esc(emoji)}">`;
}
/* Si falla una imagen: menú → emoji; banner → texto de respaldo */
document.addEventListener("error",function(e){
  const t=e.target;
  if(!t || t.tagName!=="IMG") return;
  if(t.classList.contains("banner-img")){ const b=t.closest("[data-banner]"); if(b) b.classList.add("noimg"); return; }
  if(t.dataset && t.dataset.emoji!==undefined){ const p=t.parentNode; if(p) p.textContent=t.dataset.emoji; }
},true);

/* Banners cuya imagen ya falló antes de registrar el listener */
qa("img.banner-img").forEach(function(im){
  if(im.complete && im.naturalWidth===0){ const b=im.closest("[data-banner]"); if(b) b.classList.add("noimg"); }
});

function normalizarFecha(val){
  if(!val && val!==0) return "";
  if(val instanceof Date){
    const y=val.getFullYear(),m=String(val.getMonth()+1).padStart(2,"0"),d=String(val.getDate()).padStart(2,"0");
    return `${y}-${m}-${d}`;
  }
  const s=String(val).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m1=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m1) return `${m1[3]}-${m1[2].padStart(2,"0")}-${m1[1].padStart(2,"0")}`;
  const d=new Date(s);
  if(isNaN(d.getTime())) return s;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

const ESTADO_PROD_LABEL = {produccion:"En producción", secado:"En secado", descarte:"Para descarte", no_productiva:"No productiva"};
const ESTADO_PROD_TAG = {produccion:"positive", secado:"info", descarte:"danger", no_productiva:"neutral"};
const ESTADO_SAN_LABEL = {sana:"Sana", mastitis:"Mastitis", lesion:"Lesión física", tratamiento:"En tratamiento", otro:"Otro"};
const ESTADO_SAN_TAG = {sana:"positive", mastitis:"danger", lesion:"warning", tratamiento:"info", otro:"neutral"};

function tag(l,k){ return `<span class="tag ${k}">${esc(l)}</span>`; }
function tagProd(v){ return tag(ESTADO_PROD_LABEL[v]||v, ESTADO_PROD_TAG[v]||"neutral"); }
function tagSan(v){ return tag(ESTADO_SAN_LABEL[v]||v, ESTADO_SAN_TAG[v]||"neutral"); }
function tagRepro(v){ return v==="preñada" ? tag("Preñada","positive") : tag("No preñada","neutral"); }
function eartag(t){ return `<span class="eartag">${esc(t)}</span>`; }

/* ===== SHEETS ===== */
function enviarASheets(tipo, encabezados, fila){
  fetch(URL_APPS_SCRIPT, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify({ tipo, encabezados, fila })
  })
  .then(r=>r.json())
  .then(res=>{ if(res.ok) console.log("✔ "+tipo); else console.error("✘",res.error); })
  .catch(err=>console.error("Error:",err));
}

async function cargarDesdeSheets(){
  try{
    const res = await fetch(URL_APPS_SCRIPT + "?t=" + Date.now());
    const json = await res.json();
    if(!json.ok){ console.warn("GET falló:", json.error); return; }
    const d = json.data || {};

    VACAS = (d.Vacas||[]).map(v=>({
      id:String(v.id||""),arete:String(v.arete||""),nombre:String(v.nombre||""),raza:String(v.raza||""),
      fechaNacimiento:normalizarFecha(v.fechaNacimiento),fechaIngreso:normalizarFecha(v.fechaIngreso),
      estadoProductivo:String(v.estadoProductivo||"no_productiva"),
      estadoReproductivo:String(v.estadoReproductivo||"no_preñada"),
      estadoSanitario:String(v.estadoSanitario||"sana"),
      observaciones:String(v.observaciones||"")
    }));
    PRODUCCION = (d.Produccion||[]).map(p=>({
      id:String(p.id||""),fecha:normalizarFecha(p.fecha),vacaId:String(p.vacaId||""),
      turno:String(p.turno||""),litros:Number(p.litros)||0,
      registradoPor:String(p.registradoPor||""),observaciones:String(p.observaciones||"")
    }));
    EVENTOS_SANITARIOS = (d.Sanidad||[]).map(e=>({
      id:String(e.id||""),animalTipo:String(e.animalTipo||""),animalId:String(e.animalId||""),
      tipo:String(e.tipo||""),descripcion:String(e.descripcion||""),responsable:String(e.responsable||""),
      costo:Number(e.costo)||0,estado:String(e.estado||""),observaciones:String(e.observaciones||""),
      fecha:normalizarFecha(e.fecha)
    }));
    ENTREGAS_PIL = (d.EntregasPIL||[]).map(e=>({
      id:String(e.id||""),fecha:normalizarFecha(e.fecha),hora:String(e.hora||""),
      litros:Number(e.litros)||0,precioLitro:Number(e.precioLitro)||0,monto:Number(e.monto)||0,
      comprobante:String(e.comprobante||""),registradoPor:String(e.registradoPor||""),observaciones:String(e.observaciones||"")
    }));
    TERNEROS = (d.Terneros||[]).map(t=>({
      id:String(t.id||""),arete:String(t.arete||""),nombre:String(t.nombre||""),sexo:String(t.sexo||""),
      fechaNacimiento:normalizarFecha(t.fechaNacimiento),madreId:String(t.madreId||""),padre:String(t.padre||""),
      pesoNacimiento:Number(t.pesoNacimiento)||0,pesoActual:Number(t.pesoActual)||0,
      estadoSalud:String(t.estadoSalud||""),estado:String(t.estado||""),observaciones:String(t.observaciones||"")
    }));
    PESAJES_TERNEROS = (d.Pesajes||[]).map(p=>({
      id:String(p.id||""),terneroId:String(p.terneroId||""),fecha:normalizarFecha(p.fecha),
      peso:Number(p.peso)||0,observaciones:String(p.observaciones||"")
    }));

    const ids=[...VACAS,...PRODUCCION,...EVENTOS_SANITARIOS,...ENTREGAS_PIL,...TERNEROS,...PESAJES_TERNEROS]
      .map(x=>String(x.id||"").replace(/\D/g,"")).filter(Boolean).map(Number);
    if(ids.length) _id = Math.max(_id, ...ids);

    const ultimaConPrecio = ENTREGAS_PIL.filter(e=>e.precioLitro>0).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
    if(ultimaConPrecio) STATE.precioLitro = ultimaConPrecio.precioLitro;

    console.log("✔ Datos cargados:", {vacas:VACAS.length,produccion:PRODUCCION.length,sanidad:EVENTOS_SANITARIOS.length,pil:ENTREGAS_PIL.length,terneros:TERNEROS.length});
  }catch(err){
    console.error("Error leyendo Sheets:", err);
    alert("No se pudieron cargar los datos desde Google Sheets.\nVerifica la URL del Apps Script o revisa la consola (F12).");
  }
}

function guardarVaca(v){
  v.id=nextId("V"); VACAS.push(v);
  enviarASheets("Vacas",["id","arete","nombre","raza","fechaNacimiento","fechaIngreso","estadoProductivo","estadoReproductivo","estadoSanitario","observaciones"],
    [v.id,v.arete,v.nombre,v.raza,v.fechaNacimiento,v.fechaIngreso,v.estadoProductivo,v.estadoReproductivo,v.estadoSanitario,v.observaciones]);
  return v;
}
function guardarProduccion(p){
  p.id=nextId("P"); PRODUCCION.push(p);
  enviarASheets("Produccion",["id","fecha","vacaId","turno","litros","registradoPor","observaciones"],
    [p.id,p.fecha,p.vacaId,p.turno,p.litros,p.registradoPor,p.observaciones]);
  return p;
}
function guardarEntregaPIL(e){
  e.id=nextId("E"); ENTREGAS_PIL.push(e);
  enviarASheets("EntregasPIL",["id","fecha","hora","litros","precioLitro","monto","comprobante","registradoPor","observaciones"],
    [e.id,e.fecha,e.hora,e.litros,e.precioLitro,e.monto,e.comprobante,e.registradoPor,e.observaciones]);
  return e;
}
function guardarEventoSanitario(ev){
  ev.id=nextId("S"); EVENTOS_SANITARIOS.push(ev);
  enviarASheets("Sanidad",["id","animalTipo","animalId","tipo","descripcion","responsable","costo","estado","observaciones"],
    [ev.id,ev.animalTipo,ev.animalId,ev.tipo,ev.descripcion||"",ev.responsable||"",ev.costo||"",ev.estado||"",ev.observaciones||""]);
  return ev;
}
function guardarTernero(t){
  t.id=nextId("T"); TERNEROS.push(t);
  enviarASheets("Terneros",["id","arete","nombre","sexo","fechaNacimiento","madreId","padre","pesoNacimiento","pesoActual","estadoSalud","estado","observaciones"],
    [t.id,t.arete,t.nombre,t.sexo,t.fechaNacimiento,t.madreId,t.padre||"",t.pesoNacimiento,t.pesoActual,t.estadoSalud,t.estado,t.observaciones]);
  return t;
}
function guardarPesaje(p){
  p.id=nextId("W"); PESAJES_TERNEROS.push(p);
  const t=terneroById(p.terneroId);
  if(t){ t.pesoActual=p.peso; t.fechaUltimoPesaje=p.fecha; }
  enviarASheets("Pesajes",["id","terneroId","fecha","peso","observaciones"],[p.id,p.terneroId,p.fecha,p.peso,p.observaciones||""]);
  return p;
}

const STATE = {
  user:null, role:"propietario", route:"#/dashboard",
  umbralDiferencia:30, costoPorLitro:1.2, precioLitro:3.90,
  get esPropietario(){ return this.role==="propietario"; },
  get esEncargado(){ return this.role==="encargado"; },
  get puedeRegistrar(){ return this.role==="encargado"; },
  get puedeVerFinanzas(){ return this.role==="propietario"; }
};
const RUTAS_PROPIETARIO = ["#/dashboard","#/hato","#/produccion/historial","#/pil","#/sanidad/historial","#/terneraje","#/reportes","#/configuracion"];
const RUTAS_ENCARGADO   = ["#/dashboard","#/hato","#/produccion","#/produccion/historial","#/pil","#/sanidad","#/sanidad/historial","#/terneraje"];
function rutaPermitida(path){
  const lista = STATE.role==="propietario" ? RUTAS_PROPIETARIO : RUTAS_ENCARGADO;
  return lista.some(r=> path===r || path.startsWith(r+"/"));
}

function toast(title, opts){
  opts=opts||{};
  const root=q("#toastRoot"); root.innerHTML="";
  const div=document.createElement("div"); div.className="toast";
  div.innerHTML=`<div class="tt"><span class="ic-ok">✓</span> ${esc(title)}</div>
    <div class="toast-actions">
      ${opts.again?`<button data-t-again>Registrar otro</button>`:""}
      <button data-t-dash>Ir al Dashboard</button>
    </div>`;
  root.appendChild(div);
  if(opts.again) q("[data-t-again]",div).onclick=()=>{hideToast();opts.again();};
  q("[data-t-dash]",div).onclick=()=>{hideToast();navigate("#/dashboard");};
  setTimeout(hideToast,6000);
}
function hideToast(){ const t=q(".toast"); if(t){ t.classList.add("hide"); setTimeout(()=>q("#toastRoot").innerHTML="",250);} }
function openModal(html){
  const root=q("#modalRoot");
  root.innerHTML=`<div class="modal-bg" data-close-m><div class="modal" onclick="event.stopPropagation()">${html}</div></div>`;
  q("[data-close-m]",root).onclick=closeModal;
}
function closeModal(){ q("#modalRoot").innerHTML=""; }
function confirmDialog(msg,onYes){
  const root=q("#modalRoot");
  root.innerHTML=`<div class="modal-bg" data-close-c><div class="modal confirm-box" onclick="event.stopPropagation()">
    <div class="modal-body"><div class="ic">⚠️</div><h3>¿Está seguro?</h3><p class="muted" style="margin-top:6px;font-size:13px;">${esc(msg)}</p></div>
    <div class="modal-foot" style="justify-content:center;"><button class="btn btn-ghost" data-cancel>Cancelar</button><button class="btn btn-danger" data-yes>Sí, eliminar</button></div>
  </div></div>`;
  q("[data-close-c]",root).onclick=closeModal;
  q("[data-cancel]",root).onclick=closeModal;
  q("[data-yes]",root).onclick=()=>{closeModal();onYes();};
}
function validateField(fEl,cond,msg){
  if(!cond){ fEl.classList.add("invalid"); q(".err",fEl).textContent=msg; return false; }
  fEl.classList.remove("invalid"); return true;
}

function computeAlerts(){
  const a=[];
  const mast=VACAS.filter(v=>v.estadoSanitario==="mastitis").length;
  if(mast) a.push({text:`${mast} vaca(s) con mastitis`,count:mast});
  const les=VACAS.filter(v=>v.estadoSanitario==="lesion").length;
  if(les) a.push({text:`${les} vaca(s) con lesión`,count:les});
  const enProd=VACAS.filter(v=>v.estadoProductivo==="produccion").length;
  if(enProd===0 && VACAS.length) a.push({text:`Sin vacas en producción`,count:0});

function updateBell(){ q("#bellDot").style.display = computeAlerts().length?"block":"none"; }

window.addEventListener("hashchange", render);
function currentRoute(){
  let h = location.hash || "#/dashboard";
  const [path,qs]=h.split("?");
  const params={};
  if(qs) qs.split("&").forEach(kv=>{ const [k,v]=kv.split("="); params[decodeURIComponent(k)]=decodeURIComponent(v||""); });
  return {path,params};
}
function render(){
  if(!STATE.user) return;
  const {path,params}=currentRoute();
  if(!rutaPermitida(path)){ navigate("#/dashboard"); return; }
  STATE.route=path;
  renderSidebar();
  const c=q("#content");
  try{
    if(path==="#/dashboard") c.innerHTML=viewDashboard();
    else if(path==="#/hato") c.innerHTML=viewHatoLista(params);
    else if(path.startsWith("#/hato/")) c.innerHTML=viewFichaVaca(path.split("/")[2]);
    else if(path==="#/produccion") c.innerHTML=viewProduccionForm();
    else if(path==="#/produccion/historial") c.innerHTML=viewProduccionHistorial(params);
    else if(path==="#/pil") c.innerHTML=viewPIL(params);
    else if(path==="#/sanidad") c.innerHTML=viewSanidadForm();
    else if(path==="#/sanidad/historial") c.innerHTML=viewSanidadHistorial(params);
    else if(path==="#/terneraje") c.innerHTML=viewTerneraje(params);
    else if(path.startsWith("#/ternero/")) c.innerHTML=viewFichaTernero(path.split("/")[2]);
    else if(path==="#/reportes") c.innerHTML=viewReportes(params);
    else if(path==="#/configuracion") c.innerHTML=viewConfiguracion();

  }catch(e){ console.error(e); c.innerHTML=`<div class="card"><h3>Error</h3><p>${esc(e.message)}</p></div>`; }
  bindPageEvents(path,params);
  window.scrollTo(0,0);

}

/* ============ GRÁFICOS ============ */
function polar(cx,cy,r,deg){ const a=deg*Math.PI/180; return {x:(cx+r*Math.cos(a)).toFixed(2), y:(cy+r*Math.sin(a)).toFixed(2)}; }

function svgLineChart(labels, values, opts){
  opts=opts||{};
  const w=560,h=200,padL=42,padR=18,padT=28,padB=32;
  const max=Math.max(...values,1)*1.25;
  const stepX=(w-padL-padR)/Math.max(values.length-1,1);
  const pts=values.map((v,i)=>{
    const x=padL+i*stepX;
    const y=padT+(1-(v/max))*(h-padT-padB);
    return [x,y];
  });
  const path=pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const area=path+` L${pts[pts.length-1][0].toFixed(1)},${h-padB} L${pts[0][0].toFixed(1)},${h-padB} Z`;
  const gridY=[0,0.5,1].map(f=>{ const y=padT+f*(h-padT-padB); return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--border)"/>`; }).join("");
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.8" fill="var(--accent)" style="filter:drop-shadow(0 0 4px var(--accent))"><title>${labels[i]}: ${opts.fmt?opts.fmt(values[i]):values[i]}</title></circle>`).join("");
  const valLabels = pts.map((p,i)=>`<text x="${p[0]}" y="${p[1]-10}" font-size="10.5" fill="var(--ink)" text-anchor="middle" font-weight="700" font-family="JetBrains Mono">${opts.fmtLbl?opts.fmtLbl(values[i]):values[i]}</text>`).join("");
  const ls=labels.map((l,i)=>`<text x="${pts[i][0]}" y="${h-10}" font-size="10" fill="var(--ink-faint)" text-anchor="middle" font-family="Inter">${l}</text>`).join("");
  const color=opts.color||"var(--accent)";
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">
    ${gridY}
    <path d="${area}" fill="${opts.fillColor||'var(--accent-bg)'}" stroke="none"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 5px rgba(57,255,136,.6))"/>
    ${dots}${valLabels}${ls}
  </svg>`;
}

function svgBarCompare(labels,a,b,colA,colB,fmtA,fmtB,lblA,lblB){
  const w=560,h=210,padL=48,padR=12,padT=28,padB=32;
  const max=Math.max(...a,...b,1)*1.25;
  const groupW=(w-padL-padR)/labels.length;
  const barW=groupW*0.32;
  let bars="";
  labels.forEach((l,i)=>{
    const gx=padL+i*groupW+groupW*0.14;
    const hA=(a[i]/max)*(h-padT-padB), hB=(b[i]/max)*(h-padT-padB);
    const yA=h-padB-hA, yB=h-padB-hB;
    if(a[i]>0){
      bars+=`<rect x="${gx}" y="${yA}" width="${barW}" height="${hA}" rx="2.5" fill="${colA}"><title>${l} — ${fmtA?fmtA(a[i]):a[i]}</title></rect>`;
      bars+=`<text x="${gx+barW/2}" y="${yA-5}" font-size="9.5" fill="var(--ink)" text-anchor="middle" font-weight="700" font-family="JetBrains Mono">${lblA?lblA(a[i]):a[i]}</text>`;
    }
    if(b[i]>0){
      bars+=`<rect x="${gx+barW+3}" y="${yB}" width="${barW}" height="${hB}" rx="2.5" fill="${colB}"><title>${l} — ${fmtB?fmtB(b[i]):b[i]}</title></rect>`;
      bars+=`<text x="${gx+barW+3+barW/2}" y="${yB-5}" font-size="9.5" fill="var(--ink)" text-anchor="middle" font-weight="700" font-family="JetBrains Mono">${lblB?lblB(b[i]):b[i]}</text>`;
    }
    bars+=`<text x="${gx+barW+1.5}" y="${h-10}" font-size="10" fill="var(--ink-faint)" text-anchor="middle" font-family="Inter">${l}</text>`;
  });
  const maxLabel=(max/1.25);
  const yAxis=[0,0.5,1].map(f=>{
    const val=maxLabel*(1-f);
    const y=padT+f*(h-padT-padB);
    return `<text x="${padL-6}" y="${y+3}" font-size="9" fill="var(--ink-faint)" text-anchor="end" font-family="Inter">${Math.round(val)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">${yAxis}${bars}</svg>`;
}

function svgBarSingle(labels, values, opts){
  opts=opts||{};
  const w=560,h=200,padL=48,padR=12,padT=28,padB=32;
  const max=Math.max(...values.map(v=>Math.abs(v)),1)*1.25;
  const groupW=(w-padL-padR)/labels.length;
  const barW=groupW*0.5;
  let bars="";
  labels.forEach((l,i)=>{
    const gx=padL+i*groupW+groupW*0.25;
    const hBar=(Math.abs(values[i])/max)*(h-padT-padB);
    const isNeg=values[i]<0;
    const color = isNeg ? "var(--danger)" : (opts.colorFn?opts.colorFn(values[i]) : "var(--accent)");
    const y = h-padB-hBar;
    bars+=`<rect x="${gx}" y="${y}" width="${barW}" height="${hBar}" rx="2.5" fill="${color}"><title>${l}: ${values[i]}</title></rect>`;
    const yLbl = isNeg ? (y + hBar + 12) : (y - 5);
    bars+=`<text x="${gx+barW/2}" y="${yLbl}" font-size="10" fill="var(--ink)" text-anchor="middle" font-weight="700" font-family="JetBrains Mono">${opts.fmtLbl?opts.fmtLbl(values[i]):values[i]}</text>`;
    bars+=`<text x="${gx+barW/2}" y="${h-10}" font-size="10" fill="var(--ink-faint)" text-anchor="middle" font-family="Inter">${l}</text>`;
  });
  const yAxis=[0,0.5,1].map(f=>{
    const val=(max/1.25)*(1-f);
    const y=padT+f*(h-padT-padB);
    return `<text x="${padL-6}" y="${y+3}" font-size="9" fill="var(--ink-faint)" text-anchor="end" font-family="Inter">${Math.round(val)}</text>`;
  }).join("");
  const baseLine = values.some(v=>v<0) ? `<line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="var(--ink-faint)" stroke-dasharray="2 2"/>` : "";
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">${yAxis}${baseLine}${bars}</svg>`;
}

function svgDonut(segments, centerTitle){
  const total=segments.reduce((s,x)=>s+x.value,0)||1;
  const r=58,cx=72,cy=72,sw=20;
  let angle=-90, paths="";
  segments.forEach(seg=>{
    if(seg.value<=0) return;
    const frac=seg.value/total;
    const a0=angle, a1=angle+frac*360; angle=a1;
    const large=(a1-a0)>180?1:0;
    const p0=polar(cx,cy,r,a0), p1=polar(cx,cy,r,a1);
    paths+=`<path d="M ${p0.x} ${p0.y} A ${r} ${r} 0 ${large} 1 ${p1.x} ${p1.y}" fill="none" stroke="${seg.color}" stroke-width="${sw}"><title>${seg.label}: ${seg.value}</title></path>`;
  });
  return `<svg viewBox="0 0 144 144" style="width:150px;height:150px;">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${sw}"/>
    ${paths}
    <text x="${cx}" y="${cy+6}" text-anchor="middle" font-family="Space Grotesk" font-size="22" font-weight="600" fill="var(--ink)">${centerTitle||""}</text>
  </svg>`;
}

function svgHBar(rows){
  const w=560,h=40+rows.length*36,padL=140,padR=100,padT=10;
  const max=Math.max(...rows.map(r=>r.value),1);
  let out="";
  rows.forEach((r,i)=>{
    const y=padT+i*36;
    const bw=(r.value/max)*(w-padL-padR);
    out+=`<text x="${padL-10}" y="${y+15}" text-anchor="end" font-size="11.5" font-family="Inter" font-weight="600" fill="var(--ink-soft)">${esc(r.label)}</text>
      <rect x="${padL}" y="${y}" width="${Math.max(bw,2)}" height="20" rx="4" fill="${r.color}"/>
      <text x="${padL+bw+8}" y="${y+15}" font-size="11.5" font-family="JetBrains Mono" font-weight="700" fill="var(--ink)">${r.fmt?r.fmt(r.value):r.value}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">${out}</svg>`;
}

function viewDashboard(){
  const hoy = todayStr();
  const prodHoy = PRODUCCION.filter(p=>p.fecha===hoy).reduce((s,p)=>s+p.litros,0);

  const entregasHoy = ENTREGAS_PIL.filter(e=>e.fecha===hoy);
  const litrosPIL = entregasHoy.reduce((s,e)=>s+e.litros, 0);
  const huboEntregaHoy = entregasHoy.length > 0;

  const brechaHoy = +(prodHoy - litrosPIL).toFixed(1);
  const enProd = VACAS.filter(v=>v.estadoProductivo==="produccion").length;
  const promedio = enProd ? prodHoy/enProd : 0;
  const mastitis = VACAS.filter(v=>v.estadoSanitario==="mastitis").length;
  const lesion = VACAS.filter(v=>v.estadoSanitario==="lesion").length;

  const last7 = [...Array(7)].map((_,i)=>daysAgo(6-i));
  const labels7 = last7.map(d=>fmtFecha(d).slice(0,5));

  const prodSerie = last7.map(d => PRODUCCION.filter(p=>p.fecha===d).reduce((s,p)=>s+p.litros,0));
  const pilSerie = last7.map(d => ENTREGAS_PIL.filter(x=>x.fecha===d).reduce((s,e)=>s+e.litros,0));
  const brechaSerie = last7.map((d,i) => +(prodSerie[i]-pilSerie[i]).toFixed(1));

  /* ============ PROPIETARIO ============ */
  if(STATE.role==="propietario"){
    const ingresoSerie = last7.map(d => {
      const litros = ENTREGAS_PIL.filter(x=>x.fecha===d).reduce((s,e)=>s+e.litros,0);
      return +(litros * STATE.precioLitro).toFixed(2);
    });
    const costoSerie = last7.map(d => {
      const litros = PRODUCCION.filter(p=>p.fecha===d).reduce((s,p)=>s+p.litros,0);
      return +(litros * STATE.costoPorLitro).toFixed(2);
    });
    const totalIngreso = ingresoSerie.reduce((s,x)=>s+x,0);
    const totalCosto = costoSerie.reduce((s,x)=>s+x,0);
    const totalMargen = totalIngreso - totalCosto;
    const totalLitros = prodSerie.reduce((s,x)=>s+x,0);
    const totalPIL = pilSerie.reduce((s,x)=>s+x,0);
    const brechaAcum = +(totalLitros - totalPIL).toFixed(1);

    const ingresoHoy = +(litrosPIL * STATE.precioLitro).toFixed(2);
    const costoHoy = +(prodHoy * STATE.costoPorLitro).toFixed(2);
    const margenHoy = +(ingresoHoy - costoHoy).toFixed(2);

    return `
    <div class="page-head">
      <div><h1>Dashboard</h1><p class="sub">Resumen financiero del día — ${fmtFecha(hoy)}</p></div>
    </div>

    <div class="grid grid-4">
      <div class="card kpi"><div class="lbl">Producción hoy</div><div class="val">${numLitros(prodHoy)}</div><div class="delta">${enProd} vacas en producción</div></div>
      <div class="card kpi"><div class="lbl">Entregado a PIL</div><div class="val">${numLitros(litrosPIL)}</div><div class="delta">${huboEntregaHoy ? numBs(ingresoHoy) : 'Sin registro hoy'}</div></div>
      <div class="card kpi"><div class="lbl">Brecha del día</div><div class="val" style="color:${Math.abs(brechaHoy)>STATE.umbralDiferencia?'var(--danger)':'var(--ink)'}">${numLitros(brechaHoy)}</div><div class="delta">Producción − Entrega PIL</div></div>
      <div class="card kpi"><div class="lbl">Promedio por vaca</div><div class="val">${numLitros(+promedio.toFixed(1))}</div><div class="delta">Litros / vaca</div></div>
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="lbl" style="font-size:11px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;">💰 Margen estimado del día</div>
      <div class="grid grid-3">

        <div class="kpi"><div class="lbl">Costo estimado</div><div class="val">${numBs(costoHoy)}</div><div class="delta">${numLitros(prodHoy)} × ${numBs(STATE.costoPorLitro)}</div></div>

/* ============ HATO ============ */
function viewHatoLista(params){
  const search=(params.q||"").toLowerCase();
  const fp=params.estado||"", fr=params.repro||"", fs=params.sanitario||"";
  const list=VACAS.filter(v=>{
    if(fp && v.estadoProductivo!==fp) return false;
    if(fr && v.estadoReproductivo!==fr) return false;
    if(fs && v.estadoSanitario!==fs) return false;
    if(search && !(v.arete.toLowerCase().includes(search)||v.nombre.toLowerCase().includes(search))) return false;
    return true;
  });
  const puede=STATE.puedeRegistrar;
  return `
  <div class="page-head">
    <div><h1>${puede?"Registro de vacas":"Hato"}</h1><p class="sub">${VACAS.length} animales registrados</p></div>
    ${puede?`<button class="btn btn-acc" data-open-vaca-form>+ Nueva vaca</button>`:""}
  </div>
  <div class="filters">
    <div class="fsearch"><input type="text" id="fHatoSearch" placeholder="Buscar por arete o nombre..." value="${esc(params.q||"")}"></div>
    <select id="fHatoProd"><option value="">Estado productivo (todos)</option>${Object.entries(ESTADO_PROD_LABEL).map(([k,v])=>`<option value="${k}" ${fp===k?'selected':''}>${v}</option>`).join("")}</select>
    <select id="fHatoRepro"><option value="">Reproductivo (todos)</option><option value="preñada" ${fr==='preñada'?'selected':''}>Preñada</option><option value="no_preñada" ${fr==='no_preñada'?'selected':''}>No preñada</option></select>
    <select id="fHatoSan"><option value="">Sanitario (todos)</option>${Object.entries(ESTADO_SAN_LABEL).map(([k,v])=>`<option value="${k}" ${fs===k?'selected':''}>${v}</option>`).join("")}</select>
    ${(fp||fr||fs||params.q)?`<a href="#/hato" class="filter-reset">Limpiar filtros</a>`:""}
  </div>
  <div class="table-wrap"><table>
    <thead><tr><th>Arete</th><th>Nombre</th><th>Raza</th><th>Productivo</th><th>Reproductivo</th><th>Sanitario</th>${puede?'<th></th>':''}</tr></thead>
    <tbody>${list.length? list.map(v=>`<tr>
      <td>${eartag(v.arete)}</td>
      <td><a href="#/hato/${v.id}" style="text-decoration:none;font-weight:700;color:var(--ink)">${esc(v.nombre)}</a></td>
      <td>${esc(v.raza)}</td>
      <td>${tagProd(v.estadoProductivo)}</td>
      <td>${tagRepro(v.estadoReproductivo)}</td>
      <td>${tagSan(v.estadoSanitario)}</td>
      ${puede?`<td class="tbl-actions"><a class="icbtn" href="#/hato/${v.id}">👁</a><button class="icbtn" data-edit-vaca="${v.id}">✏️</button><button class="icbtn danger" data-del-vaca="${v.id}">🗑</button></td>`:""}
    </tr>`).join("") : `<tr class="empty-row"><td colspan="${puede?7:6}">${puede?'Aún no hay vacas registradas. Usa el botón "+ Nueva vaca".':'Aún no hay vacas registradas.'}</td></tr>`}</tbody>
  </table></div>`;
}

function vacaFormModal(existing){
  if(!STATE.puedeRegistrar) return;
  const v = existing || {arete:"",nombre:"",raza:RAZAS[0],fechaNacimiento:"",fechaIngreso:todayStr(),estadoProductivo:"produccion",estadoReproductivo:"no_preñada",estadoSanitario:"sana",observaciones:""};
  openModal(`
    <div class="modal-head"><h3>${existing?'Editar vaca':'Nueva vaca'}</h3><button class="modal-close" data-close-m>✕</button></div>
    <form id="vacaForm"><div class="modal-body">
      <div class="form-row">
        <div class="f" id="f_arete"><label>Número de arete <span class="req">*</span></label><input name="arete" value="${esc(v.arete)}"><div class="err"></div></div>
        <div class="f" id="f_nombre"><label>Nombre <span class="req">*</span></label><input name="nombre" value="${esc(v.nombre)}"><div class="err"></div></div>
      </div>
      <div class="form-row">
        <div class="f"><label>Raza</label><select name="raza">${RAZAS.map(r=>`<option ${v.raza===r?'selected':''}>${r}</option>`).join("")}</select></div>
        <div class="f"><label>Fecha de nacimiento</label><input type="date" name="fechaNacimiento" value="${v.fechaNacimiento}" max="${todayStr()}"></div>
      </div>
      <div class="form-row">
        <div class="f"><label>Fecha de ingreso</label><input type="date" name="fechaIngreso" value="${v.fechaIngreso}" max="${todayStr()}"></div>
        <div class="f"><label>Estado productivo</label><select name="estadoProductivo">${Object.entries(ESTADO_PROD_LABEL).map(([k,l])=>`<option value="${k}" ${v.estadoProductivo===k?'selected':''}>${l}</option>`).join("")}</select></div>
      </div>
      <div class="form-row">
        <div class="f"><label>Estado reproductivo</label><select name="estadoReproductivo"><option value="preñada" ${v.estadoReproductivo==='preñada'?'selected':''}>Preñada</option><option value="no_preñada" ${v.estadoReproductivo==='no_preñada'?'selected':''}>No preñada</option></select></div>
        <div class="f"><label>Estado sanitario</label><select name="estadoSanitario">${Object.entries(ESTADO_SAN_LABEL).map(([k,l])=>`<option value="${k}" ${v.estadoSanitario===k?'selected':''}>${l}</option>`).join("")}</select></div>
      </div>
      <div class="f"><label>Observaciones</label><textarea name="observaciones">${esc(v.observaciones)}</textarea></div>
    </div>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close-m>Cancelar</button><button type="submit" class="btn btn-acc">${existing?'Guardar cambios':'Registrar vaca'}</button></div>
    </form>`);
  qa("[data-close-m]",q("#modalRoot")).forEach(b=>b.onclick=closeModal);
  q("#vacaForm").onsubmit=function(e){
    e.preventDefault();
    const fd=new FormData(e.target);
    const arete=fd.get("arete").trim(), nombre=fd.get("nombre").trim();
    let ok=true;
    ok=validateField(q("#f_arete"),arete.length>0,"El arete es obligatorio.")&&ok;
    ok=validateField(q("#f_nombre"),nombre.length>0,"El nombre es obligatorio.")&&ok;
    if(!ok) return;
    const data={arete,nombre,raza:fd.get("raza"),fechaNacimiento:fd.get("fechaNacimiento"),fechaIngreso:fd.get("fechaIngreso"),estadoProductivo:fd.get("estadoProductivo"),estadoReproductivo:fd.get("estadoReproductivo"),estadoSanitario:fd.get("estadoSanitario"),observaciones:fd.get("observaciones").trim()};
    if(existing){ Object.assign(existing,data); closeModal(); toast("Vaca actualizada."); render(); }
    else{ guardarVaca(data); closeModal(); toast("Vaca guardada.",{again:()=>vacaFormModal()}); render(); }
  };
}

          <td class="tright mono" style="font-weight:700;color:${Math.abs(r.dif)>STATE.umbralDiferencia?'var(--danger)':'var(--ink)'}">${r.dif} L</td>
          ${esPropietario?`<td class="tright mono">${numBs(monto)}</td>`:''}
        </tr>`;
      }).join("") : `<tr class="empty-row"><td colspan="${esPropietario?5:4}">Aún no hay entregas registradas.</td></tr>`}</tbody>
    </table></div>
  </div>`;

  const historial = esEncargado ? `
  <div class="sec-title"><h2>Historial de entregas</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Fecha</th><th>Hora</th><th class="tright">Litros entregados</th><th>Registrado por</th></tr></thead>
    <tbody>${ENTREGAS_PIL.length? ENTREGAS_PIL.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(e=>`<tr><td>${fmtFecha(e.fecha)}</td><td>${e.hora}</td><td class="tright mono">${e.litros} L</td><td>${esc(e.registradoPor||'—')}</td></tr>`).join("") : `<tr class="empty-row"><td colspan="4">Aún no hay entregas registradas.</td></tr>`}</tbody>
  </table></div>
  ` : `
  <div class="sec-title"><h2>Historial de entregas (con montos)</h2></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Fecha</th><th>Hora</th><th class="tright">Litros</th><th class="tright">Precio actual</th><th class="tright">Monto</th><th>Comprobante</th></tr></thead>
    <tbody>${ENTREGAS_PIL.length? ENTREGAS_PIL.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(e=>{
      const precio = STATE.precioLitro;
      const monto = e.litros * precio;
      return `<tr><td>${fmtFecha(e.fecha)}</td><td>${e.hora}</td><td class="tright mono">${e.litros} L</td><td class="tright mono">${numBs(precio)}</td><td class="tright mono">${numBs(monto)}</td><td class="mono">${esc(e.comprobante||'—')}</td></tr>`;
    }).join("") : `<tr class="empty-row"><td colspan="6">Aún no hay entregas registradas.</td></tr>`}</tbody>
  </table></div>
  `;

  const totalProd = PRODUCCION.reduce((s,p)=>s+p.litros,0);
  const totalPIL = ENTREGAS_PIL.reduce((s,e)=>s+e.litros,0);
  const brechaTotal = +(totalProd - totalPIL).toFixed(1);
  const totalMonto = totalPIL * STATE.precioLitro;

  const kpis = `
  <div class="grid ${esPropietario?'grid-4':'grid-3'}" style="margin-bottom:18px;">
    <div class="card kpi"><div class="lbl">Total producido</div><div class="val">${numLitros(totalProd)}</div></div>
    <div class="card kpi"><div class="lbl">Total entregado a PIL</div><div class="val">${numLitros(totalPIL)}</div></div>
    <div class="card kpi"><div class="lbl">Brecha acumulada</div><div class="val" style="color:${Math.abs(brechaTotal)>STATE.umbralDiferencia?'var(--danger)':'var(--ink)'}">${numLitros(brechaTotal)}</div></div>
    ${esPropietario?`<div class="card kpi"><div class="lbl">Monto acumulado</div><div class="val">${numBs(totalMonto)}</div><div class="delta">${numBs(STATE.precioLitro)}/L × ${numLitros(totalPIL)}</div></div>`:''}
  </div>`;

  return `
  <div class="page-head">
    <div><h1>Entrega a PIL</h1>
      <p class="sub">${esEncargado ? "Registra la leche entregada a la planta" : "Registro, precio por litro y comparación con producción"}</p>
    </div>
  </div>
  ${kpis}
  <div class="charts-grid">
    ${esEncargado ? formEncargado : formPropietario}
    ${comparaTabla}
  </div>
  ${historial}`;
}

function viewReportes(){
  if(!STATE.puedeVerFinanzas) return `<div class="card">Acceso restringido.</div>`;
  const totalLitrosProd = PRODUCCION.reduce((s,p)=>s+p.litros,0);

  const totalIngreso = ENTREGAS_PIL.reduce((s,e)=>s+e.litros*STATE.precioLitro,0);

  const brechaTotal = totalLitrosProd - totalLitrosPIL;
  return `
  <div class="page-head"><div><h1>Reportes</h1><p class="sub">Análisis financiero y productivo acumulado — precio actual ${numBs(STATE.precioLitro)}/L</p></div></div>

    <div class="card kpi"><div class="lbl">Brecha acumulada</div><div class="val" style="color:${Math.abs(brechaTotal)>STATE.umbralDiferencia?'var(--danger)':'var(--ink)'}">${numLitros(brechaTotal)}</div></div>
    <div class="card kpi"><div class="lbl">Margen acumulado</div><div class="val" style="color:${totalMargen<0?'var(--danger)':'var(--positive)'}">${numBs(totalMargen)}</div></div>

  <div class="card" style="margin-top:14px;">
    <h3 style="font-size:15px;margin-bottom:10px;">Resumen financiero</h3>
    ${svgHBar([

      {label:"Costo total", value:totalCosto, color:"var(--danger)", fmt:numBs},

function doGlobalSearch(term){
  const box=q("#searchResults");
  term=term.trim().toLowerCase();
  if(!term){ box.classList.remove("show"); box.innerHTML=""; return; }
  const vRes=VACAS.filter(v=>v.arete.toLowerCase().includes(term)||v.nombre.toLowerCase().includes(term)).slice(0,5);
  const tRes=TERNEROS.filter(t=>t.arete.toLowerCase().includes(term)||t.nombre.toLowerCase().includes(term)).slice(0,5);
  let html="";
  vRes.forEach(v=>html+=`<div class="sr-item" data-goto="#/hato/${v.id}">🐄 ${esc(v.nombre)} <span class="mono muted">${v.arete}</span></div>`);
  tRes.forEach(t=>html+=`<div class="sr-item" data-goto="#/ternero/${t.id}">🐮 ${esc(t.nombre)} <span class="mono muted">${t.arete}</span></div>`);
  box.innerHTML=html||`<div class="sr-empty">Sin resultados para "${esc(term)}"</div>`;
  box.classList.add("show");
}

/* ===== EVENTOS ===== */
function bindPageEvents(path,params){
  q("#content").onclick=function(e){
    const goto=e.target.closest("[data-goto]");
    if(goto){ navigate(goto.getAttribute("data-goto")); return; }
    const editV=e.target.closest("[data-edit-vaca]");
    if(editV && STATE.puedeRegistrar){ vacaFormModal(vacaById(editV.getAttribute("data-edit-vaca"))); return; }
    const delV=e.target.closest("[data-del-vaca]");
    if(delV && STATE.puedeRegistrar){ const id=delV.getAttribute("data-del-vaca"); const v=vacaById(id);
      confirmDialog(`¿Eliminar la vaca "${v.nombre}"?`, ()=>{ VACAS=VACAS.filter(x=>x.id!==id); toast("Eliminada."); render(); }); return; }
    const openV=e.target.closest("[data-open-vaca-form]");
    if(openV && STATE.puedeRegistrar){ vacaFormModal(); return; }
    const openT=e.target.closest("[data-open-ternero-form]");
    if(openT && STATE.puedeRegistrar){ terneroFormModal(); return; }
    const openP=e.target.closest("[data-open-pesaje]");
    if(openP && STATE.puedeRegistrar){ pesajeModal(openP.getAttribute("data-open-pesaje")); return; }
  };

  if(path==="#/hato"){
    const apply=()=>{
      const p=new URLSearchParams();
      const s=q("#fHatoSearch").value.trim(); if(s) p.set("q",s);
      if(q("#fHatoProd").value) p.set("estado",q("#fHatoProd").value);
      if(q("#fHatoRepro").value) p.set("repro",q("#fHatoRepro").value);
      if(q("#fHatoSan").value) p.set("sanitario",q("#fHatoSan").value);
      navigate("#/hato"+(p.toString()?"?"+p.toString():""));
    };
    q("#fHatoSearch").addEventListener("input",debounce(apply,350));
    q("#fHatoProd").onchange=apply; q("#fHatoRepro").onchange=apply; q("#fHatoSan").onchange=apply;
  }

  if(path==="#/produccion" && STATE.puedeRegistrar){
    const form=q("#prodForm");
    if(form) form.onsubmit=function(e){
      e.preventDefault();
      const fd=new FormData(e.target);
      const vacaId=fd.get("vacaId"), litros=parseFloat(fd.get("litros"));
      let ok=true;
      ok=validateField(q("#f_pvaca"),!!vacaId,"Selecciona una vaca.")&&ok;
      ok=validateField(q("#f_plitros"),!isNaN(litros)&&litros>=0,"Ingresa litros válidos.")&&ok;
      if(!ok) return;
      guardarProduccion({fecha:fd.get("fecha"),vacaId,turno:fd.get("turno"),litros,registradoPor:fd.get("registradoPor"),observaciones:fd.get("observaciones").trim()});
      toast("Producción guardada.",{again:()=>render()});
      e.target.reset();
      q("[name=fecha]",e.target).value=todayStr();
      q("[name=registradoPor]",e.target).value=STATE.user.nombre;
    };
  }

  if(path==="#/pil"){
    const form=q("#pilForm");
    if(form){
      const litrosEl = q("[name=litros]", form);
      const precioEl = q("[name=precioLitro]", form);
      const preview = q("#pilMontoPreview");

      if(preview && precioEl && litrosEl){
        const updatePreview = ()=>{
          const l = parseFloat(litrosEl.value)||0;
          const p = parseFloat(precioEl.value)||0;
          preview.value = numBs(l*p);
        };
        litrosEl.addEventListener("input", updatePreview);
        precioEl.addEventListener("input", updatePreview);
        updatePreview();
      }

      form.onsubmit = function(e){
        e.preventDefault();
        const fd=new FormData(e.target);
        const litros=parseFloat(fd.get("litros"));
        if(!validateField(q("#f_pillitros"),!isNaN(litros)&&litros>=0,"Ingresa litros válidos.")) return;

        let precio;
        if(STATE.esEncargado){
          precio = STATE.precioLitro;
        } else {
          precio = parseFloat(fd.get("precioLitro"));
          if(!validateField(q("#f_pilprecio"),!isNaN(precio)&&precio>=0,"Ingresa un precio válido.")) return;
          if(precio !== STATE.precioLitro){
            STATE.precioLitro = precio;
          }
        }

        const monto = +(litros*precio).toFixed(2);
        guardarEntregaPIL({
          fecha: fd.get("fecha"),
          hora: fd.get("hora"),
          litros,
          precioLitro: precio,
          monto: monto,
          comprobante: fd.get("comprobante") || "",
          registradoPor: fd.get("registradoPor"),
          observaciones: (fd.get("observaciones")||"").trim()
        });
        toast("Entrega a PIL registrada.", {again:()=>render()});
        render();
      };
    }
  }

  if(path==="#/sanidad" && STATE.puedeRegistrar){
    const refreshAnimales=()=>{
      const tipo=q("#sanAnimalTipo").value;
      const sel=q("#sanAnimalId");
      sel.innerHTML=`<option value="">Seleccionar...</option>`+(tipo==="vaca" ? VACAS.map(v=>`<option value="${v.id}">${v.arete} — ${v.nombre}</option>`).join("") : TERNEROS.map(t=>`<option value="${t.id}">${t.arete} — ${t.nombre}</option>`).join(""));
    };
    refreshAnimales();
    q("#sanAnimalTipo").onchange=refreshAnimales;
    q("#sanForm").onsubmit=function(e){
      e.preventDefault();
      const fd=new FormData(e.target);
      const animalId=fd.get("animalId");
      if(!validateField(q("#f_sananimal"),!!animalId,"Selecciona un animal.")) return;
      const data={animalTipo:fd.get("animalTipo"),animalId,tipo:fd.get("tipo"),descripcion:(fd.get("descripcion")||"").trim(),tratamiento:(fd.get("tratamiento")||"").trim(),fecha:fd.get("fecha")||todayStr(),responsable:fd.get("responsable"),costo:parseFloat(fd.get("costo"))||0,estado:fd.get("estado"),observaciones:(fd.get("observaciones")||"").trim()};
      guardarEventoSanitario(data);
      toast("Evento sanitario guardado.",{again:()=>render()});
      e.target.reset(); refreshAnimales();
    };
  }

  if(path==="#/configuracion" && STATE.puedeVerFinanzas){
    q("#finSave").onclick=()=>{
      const p=parseFloat(q("#precioInput").value); if(!isNaN(p)) STATE.precioLitro=p;
      const c=parseFloat(q("#costoInput").value); if(!isNaN(c)) STATE.costoPorLitro=c;
      const u=parseInt(q("#umbralInput").value,10); if(!isNaN(u)) STATE.umbralDiferencia=u;
      toast("Parámetros actualizados. Los montos se recalculan con el nuevo precio.");
      render();
    };
  }
}
function debounce(fn,ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

/* ===== INIT ===== */
function populateUserSelect(role){
  const sel=q("#userSelect");
  sel.innerHTML=USUARIOS.filter(u=>u.rol===role).map(u=>`<option value="${u.id}">${u.nombre}</option>`).join("");
}
populateUserSelect("propietario");
qa(".role-opt",q("#rolePicker")).forEach(opt=>{
  opt.onclick=function(){
    qa(".role-opt",q("#rolePicker")).forEach(o=>o.classList.remove("active"));
    opt.classList.add("active");
    populateUserSelect(opt.getAttribute("data-role"));
  };
});

q("#loginBtn").onclick=async function(){
  const role=q(".role-opt.active",q("#rolePicker")).getAttribute("data-role");
  const userId=q("#userSelect").value;
  STATE.role=role;
  STATE.user=USUARIOS.find(u=>u.id===userId)||USUARIOS.find(u=>u.rol===role);
  const btn=q("#loginBtn"); btn.disabled=true; btn.textContent="Cargando datos...";
  q("#screen-login").style.display="none";
  q("#app").classList.add("on");
  q("#content").innerHTML=`<div class="card" style="text-align:center;padding:40px;">
    <div style="font-size:32px;margin-bottom:12px;">⏳</div>
    <h3>Cargando datos desde Google Sheets...</h3>
    <p class="muted" style="margin-top:6px;">Esto puede tardar unos segundos.</p>
  </div>`;
  await cargarDesdeSheets();
  btn.disabled=false; btn.textContent="Entrar al sistema";
  location.hash="#/dashboard";
  render();
};

q("#hamburgerBtn").onclick=openDrawer;
q("#drawerBg").onclick=closeDrawer;
q("#bellBtn").onclick=function(){
  const alerts=computeAlerts();
  openModal(`<div class="modal-head"><h3>Alertas</h3><button class="modal-close" data-close-m>✕</button></div>
    <div class="modal-body">${alerts.length? alerts.map(a=>`<div class="alert-item"><span class="dot"></span><span class="txt">${esc(a.text)}</span><span class="cnt">${a.count}</span></div>`).join("") : `<div class="empty-alerts">Sin alertas activas.</div>`}</div>`);
  qa("[data-close-m]",q("#modalRoot")).forEach(b=>b.onclick=closeModal);
};
q("#globalSearch").addEventListener("input",debounce(e=>doGlobalSearch(e.target.value),200));
q("#searchResults").onclick=function(e){
  const item=e.target.closest("[data-goto]");
  if(item){ navigate(item.getAttribute("data-goto")); q("#globalSearch").value=""; q("#searchResults").classList.remove("show"); }
};
document.addEventListener("click",function(e){
  if(!e.target.closest(".searchbar") && !e.target.closest("#searchResults")) q("#searchResults").classList.remove("show");
});

})();
</script>
</body>
