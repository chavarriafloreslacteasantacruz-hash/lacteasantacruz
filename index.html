function doGlobalSearch(term){
  const box=q("#searchResults");
  term=term.trim().toLowerCase();
  if(!term){ box.classList.remove("show"); box.innerHTML=""; return; }
  const vRes=VACAS.filter(v=>v.arete.toLowerCase().includes(term)||v.nombre.toLowerCase().includes(term)).slice(0,5);
  const tRes=TERNEROS.filter(t=>t.arete.toLowerCase().includes(term)||t.nombre.toLowerCase().includes(term)).slice(0,5);
  let html="";
  vRes.forEach(v=>html+=`<div class="sr-item" data-goto="#/hato/${v.id}">🐄 ${esc(v.nombre)} <span class="mono muted">${v.arete}</span></div>`);
  tRes.forEach(t=>html+=`<div class="sr-item" data-goto="#/ternero/${t.id}">🐮 ${esc(t.nombre)} <span class="mono muted">${t.arete}</span></div>`);
  box.innerHTML=html||`<div class="sr-empty">Sin resultados para "${esc(term)}"</div>`;
  box.classList.add("show");
}

/* ===== EVENTOS ===== */
function bindPageEvents(path,params){
  q("#content").onclick=function(e){
    const goto=e.target.closest("[data-goto]");
    if(goto){ navigate(goto.getAttribute("data-goto")); return; }
    const editV=e.target.closest("[data-edit-vaca]");
    if(editV && STATE.puedeRegistrar){ vacaFormModal(vacaById(editV.getAttribute("data-edit-vaca"))); return; }
    const delV=e.target.closest("[data-del-vaca]");
    if(delV && STATE.puedeRegistrar){ const id=delV.getAttribute("data-del-vaca"); const v=vacaById(id);
      confirmDialog(`¿Eliminar la vaca "${v.nombre}"? (solo en memoria por ahora)`, ()=>{ VACAS=VACAS.filter(x=>x.id!==id); toast("Eliminada de memoria."); render(); }); return; }
    const openV=e.target.closest("[data-open-vaca-form]");
    if(openV && STATE.puedeRegistrar){ vacaFormModal(); return; }
    const openT=e.target.closest("[data-open-ternero-form]");
    if(openT && STATE.puedeRegistrar){ terneroFormModal(); return; }
    const openP=e.target.closest("[data-open-pesaje]");
    if(openP && STATE.puedeRegistrar){ pesajeModal(openP.getAttribute("data-open-pesaje")); return; }
  };

  if(path==="#/hato"){
    const apply=()=>{
      const p=new URLSearchParams();
      const s=q("#fHatoSearch").value.trim(); if(s) p.set("q",s);
      if(q("#fHatoProd").value) p.set("estado",q("#fHatoProd").value);
      if(q("#fHatoRepro").value) p.set("repro",q("#fHatoRepro").value);
      if(q("#fHatoSan").value) p.set("sanitario",q("#fHatoSan").value);
      navigate("#/hato"+(p.toString()?"?"+p.toString():""));
    };
    q("#fHatoSearch").addEventListener("input",debounce(apply,350));
    q("#fHatoProd").onchange=apply; q("#fHatoRepro").onchange=apply; q("#fHatoSan").onchange=apply;
  }

  if(path==="#/produccion" && STATE.puedeRegistrar){
    const form=q("#prodForm");
    if(form) form.onsubmit = async function(e){
      e.preventDefault();
      const fd=new FormData(e.target);
      const vacaId=fd.get("vacaId"), litros=parseFloat(fd.get("litros"));
      let ok=true;
      ok=validateField(q("#f_pvaca"),!!vacaId,"Selecciona una vaca.")&&ok;
      ok=validateField(q("#f_plitros"),!isNaN(litros)&&litros>=0&&litros<=60,"Ingresa entre 0 y 60 litros por turno.")&&ok;
      if(!ok) return;
      const btn = q("button[type=submit]",e.target); if(btn){ btn.disabled=true; btn.textContent="Guardando..."; }
      const r = await guardarProduccion({fecha:fd.get("fecha"),vacaId,turno:fd.get("turno"),litros,registradoPor:fd.get("registradoPor"),observaciones:fd.get("observaciones").trim()});
      if(r.ok){
        confirmacionRegistro(r,"Producción");
        renderLivePanel("produccion");
        q("#prodVacaId").value = "";
        q("#prodLitros").value = "";
        const obs = q("textarea[name=observaciones]", e.target); if(obs) obs.value = "";
        q("#prodVacaId").focus();
        if(btn){ btn.disabled=false; btn.textContent="Guardar producción"; }
        updateBell();
      } else {
        if(btn){ btn.disabled=false; btn.textContent="Guardar producción"; }
        toast("No se pudo guardar. Verificá conexión.", {error:true});
      }
    };
  }

  if(path==="#/pil"){
    const form=q("#pilForm");
    if(form){
      const litrosEl = q("[name=litros]", form);
      const precioEl = q("[name=precioLitro]", form);
      const preview = q("#pilMontoPreview");
      if(preview && precioEl && litrosEl){
        const updatePreview = ()=>{
          const l = parseFloat(litrosEl.value)||0;
          const p = parseFloat(precioEl.value)||0;
          preview.value = numBs(l*p);
        };
        litrosEl.addEventListener("input", updatePreview);
        precioEl.addEventListener("input", updatePreview);
        updatePreview();
      }
      form.onsubmit = async function(e){
        e.preventDefault();
        const fd=new FormData(e.target);
        const litros=parseFloat(fd.get("litros"));
        if(!validateField(q("#f_pillitros"),!isNaN(litros)&&litros>=0&&litros<=60,"Ingresa entre 0 y 60 litros por turno.")) return;
        let precio;
        if(STATE.esEncargado){
          precio = STATE.precioLitro;
        } else {
          precio = parseFloat(fd.get("precioLitro"));
          if(!validateField(q("#f_pilprecio"),!isNaN(precio)&&precio>=0,"Ingresa un precio válido.")) return;
          if(precio !== STATE.precioLitro) STATE.precioLitro = precio;
        }
        const monto = +(litros*precio).toFixed(2);
        const btn = q("button[type=submit]",e.target); if(btn){ btn.disabled=true; btn.textContent="Guardando..."; }
        const r = await guardarEntregaPIL({
          fecha: fd.get("fecha"),
          hora: fd.get("hora"),
          litros,
          precioLitro: precio,
          monto: monto,
          comprobante: fd.get("comprobante") || "",
          registradoPor: fd.get("registradoPor"),
          observaciones: (fd.get("observaciones")||"").trim()
        });
        if(r.ok){
          confirmacionRegistro(r,"Entrega a PIL");
          if(STATE.esEncargado){
            renderLivePanel("pil");
            q("[name=litros]", e.target).value = "";
            q("[name=litros]", e.target).focus();
          } else {
            render();
          }
          if(btn){ btn.disabled=false; btn.textContent="Guardar entrega"; }
          updateBell();
        } else {
          if(btn){ btn.disabled=false; btn.textContent="Guardar entrega"; }
          toast("No se pudo guardar la entrega.", {error:true});
        }
      };
    }
  }

  if(path==="#/sanidad" && STATE.puedeRegistrar){
    const refreshAnimales=()=>{
      const tipo=q("#sanAnimalTipo").value;
      const sel=q("#sanAnimalId");
      sel.innerHTML=`<option value="">Seleccionar...</option>`+(tipo==="vaca" ? VACAS.map(v=>`<option value="${v.id}">${v.arete} — ${v.nombre}</option>`).join("") : TERNEROS.map(t=>`<option value="${t.id}">${t.arete} — ${t.nombre}</option>`).join(""));
    };
    refreshAnimales();
    q("#sanAnimalTipo").onchange=refreshAnimales;
    q("#sanForm").onsubmit = async function(e){
      e.preventDefault();
      const fd=new FormData(e.target);
      const animalId=fd.get("animalId");
      if(!validateField(q("#f_sananimal"),!!animalId,"Selecciona un animal.")) return;
      const data={animalTipo:fd.get("animalTipo"),animalId,tipo:fd.get("tipo"),descripcion:(fd.get("descripcion")||"").trim(),tratamiento:(fd.get("tratamiento")||"").trim(),fecha:fd.get("fecha")||todayStr(),responsable:fd.get("responsable"),costo:parseFloat(fd.get("costo"))||0,estado:fd.get("estado"),observaciones:(fd.get("observaciones")||"").trim()};
      const btn = q("button[type=submit]",e.target); if(btn){ btn.disabled=true; btn.textContent="Guardando..."; }
      const r = await guardarEventoSanitario(data);
      if(r.ok){
        // Aplicar cambio de estado sanitario en memoria (solo vacas) y unificar toast
        const res = aplicarCambioEstadoPorEvento(data);
        if(res.cambio){
          const nombreV = res.vaca ? res.vaca.nombre : "";
          const labelAnt = ESTADO_SAN_LABEL[res.estadoAnterior] || res.estadoAnterior;
          const labelNue = ESTADO_SAN_LABEL[res.estadoNuevo] || res.estadoNuevo;
          toast(`Evento guardado. Número de registro: ${r.data.id}. ${nombreV} ahora figura con "${labelNue}" (antes: ${labelAnt}).`, {registroId:r.data.id, info:true});
        } else {
          confirmacionRegistro(r,"Evento sanitario");
        }
        renderLivePanel("sanidad");
        e.target.reset();
        refreshAnimales();
        if(btn){ btn.disabled=false; btn.textContent="Guardar evento"; }
        updateBell();
      } else {
        if(btn){ btn.disabled=false; btn.textContent="Guardar evento"; }
        toast("No se pudo guardar el evento: " + (r.error || "Error desconocido"), {error:true}); console.error("Error al registrar sanidad:",r.error);
      }
    };
  }

  if(path==="#/configuracion" && STATE.puedeVerFinanzas){
    q("#finSave").onclick=()=>{
      const p=parseFloat(q("#precioInput").value); if(!isNaN(p)) STATE.precioLitro=p;
      const c=parseFloat(q("#costoInput").value); if(!isNaN(c)) STATE.costoPorLitro=c;
      const u=parseInt(q("#umbralInput").value,10); if(!isNaN(u)) STATE.umbralDiferencia=u;
      toast("Parámetros actualizados.");
      render();
    };
  }

  if(path==="#/reportes" && STATE.puedeVerFinanzas){
    const mesInput=q("#fMes");
    const aplicarReporte=()=>{
      const p=new URLSearchParams();
      const m=q("#fMes").value; if(m) p.set("mes",m);
      const desde=q("#reporteDesde").value, hasta=q("#reporteHasta").value;
      if(desde && desde.startsWith(m)) p.set("desde",desde);
      if(hasta && hasta.startsWith(m)) p.set("hasta",hasta);
      if(desde && hasta && desde>hasta){ toast("La fecha inicial no puede ser posterior a la final.",{error:true});return; }
      navigate("#/reportes?"+p.toString());
    };
    if(mesInput) mesInput.onchange=()=>navigate("#/reportes?mes="+encodeURIComponent(mesInput.value));
    q("#reporteDesde").onchange=aplicarReporte;
    q("#reporteHasta").onchange=aplicarReporte;
    q("#exportarResumenMensual").onclick=()=>exportarResumenMensual(params);
  }
}

function exportarResumenMensual(params){
  if(!STATE.puedeVerFinanzas) return;
  const mes=/^\d{4}-\d{2}$/.test(params.mes||"")?params.mes:monthStr();
  const desde=params.desde&&params.desde.startsWith(mes)?params.desde:"";
  const hasta=params.hasta&&params.hasta.startsWith(mes)?params.hasta:"";
  const enRango=f=>f.startsWith(mes)&&(!desde||f>=desde)&&(!hasta||f<=hasta);
  const produccion=PRODUCCION.filter(p=>enRango(p.fecha));
  const entregas=ENTREGAS_PIL.filter(e=>enRango(e.fecha));
  const sanidad=EVENTOS_SANITARIOS.filter(e=>enRango(e.fecha));
  const fechas=[...new Set([...produccion.map(p=>p.fecha),...entregas.map(e=>e.fecha)])].sort();
  const sumar=(arr,clave)=>arr.reduce((s,x)=>s+(Number(x[clave])||0),0);
  const filas=fechas.map(f=>{
    const prod=sumar(produccion.filter(p=>p.fecha===f),"litros");
    const pil=entregas.filter(e=>e.fecha===f);
    const entregado=sumar(pil,"litros");
    const ingreso=sumar(pil,"monto");
    const costo=prod*STATE.costoPorLitro;
    return [f,prod,entregado,prod-entregado,ingreso,costo,ingreso-costo];
  });
  const prodTotal=sumar(produccion,"litros"), pilTotal=sumar(entregas,"litros");
  const ingresoTotal=sumar(entregas,"monto"), costoTotal=prodTotal*STATE.costoPorLitro;
  const sanTotal=sumar(sanidad,"costo");
  const csv=[
    ["Resumen mensual de Control Lechero",mes],
    ["Desde",desde||mes+"-01"],["Hasta",hasta||"Fin del mes"],
    ["Nota","Costos y margen estimados; el costo sanitario se informa por separado y no se descuenta nuevamente"],
    ["Producción total (L)",prodTotal],["Entrega total (L)",pilTotal],
    ["Ingresos registrados (Bs)",ingresoTotal],["Costo estimado (Bs)",costoTotal],
    ["Margen estimado (Bs)",ingresoTotal-costoTotal],["Costo sanitario registrado (Bs)",sanTotal],
    [],["Fecha","Producido (L)","Entregado (L)","Diferencia (L)","Ingreso (Bs)","Costo estimado (Bs)","Margen estimado (Bs)"],...filas
  ].map(row=>row.map(v=>{const s=String(v??"");return '"'+s.replace(/"/g,'""')+'"';}).join(";")).join("\r\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=`resumen_lechero_${mes}.csv`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("Resumen mensual exportado en CSV.");
}

function debounce(fn,ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

function monthStr(){ return todayStr().slice(0,7); }
function fmtMes(ym){ const [y,m]=String(ym||"").split("-"); if(!y||!m) return ym||""; const M=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"]; return `${M[(+m)-1]||m} de ${y}`; }

/* ===== INIT ===== */
function populateUserSelect(role){
  const sel=q("#userSelect");
  sel.innerHTML=USUARIOS.filter(u=>u.rol===role).map(u=>`<option value="${u.id}">${u.nombre}</option>`).join("");
}
populateUserSelect("propietario");
qa(".role-opt",q("#rolePicker")).forEach(opt=>{
  opt.onclick=function(){
    qa(".role-opt",q("#rolePicker")).forEach(o=>o.classList.remove("active"));
    opt.classList.add("active");
    populateUserSelect(opt.getAttribute("data-role"));
  };
});

q("#loginBtn").onclick=async function(){
  const role=q(".role-opt.active",q("#rolePicker")).getAttribute("data-role");
  const userId=q("#userSelect").value;
  STATE.role=role;
  STATE.user=USUARIOS.find(u=>u.id===userId)||USUARIOS.find(u=>u.rol===role);
  if(!STATE.user){ toast("No hay usuario seleccionado.", {error:true}); return; }
  const btn=q("#loginBtn"); btn.disabled=true; btn.textContent="Cargando datos...";
  q("#screen-login").style.display="none";
  q("#app").classList.add("on");
  q("#content").innerHTML=`<div class="card" style="text-align:center;padding:40px;">
    <div style="font-size:32px;margin-bottom:12px;">⏳</div>
    <h3>Cargando datos desde Google Sheets...</h3>
    <p class="muted" style="margin-top:6px;">Esto puede tardar unos segundos.</p>
  </div>`;
  const ok = await cargarDesdeSheets();
  btn.disabled=false; btn.textContent="Entrar al sistema";
  if(!ok){
    toast("No se pudieron cargar los datos desde Sheets. No se mostrarán datos actualizados; verifica la conexión antes de registrar.", {error:true});
  }
  location.hash="#/dashboard";
  render();
};

let sincronizando = false;
async function sincronizarVista(){
  if(!STATE.user || sincronizando || q("#modalRoot").children.length || document.hidden) return;
  const ruta=currentRoute().path;
  if(["#/produccion","#/sanidad","#/configuracion"].includes(ruta)) return;
  if(document.activeElement && ["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) return;
  sincronizando=true;
  try{ if(await cargarDesdeSheets()) render(); }
  finally{ sincronizando=false; }
}
setInterval(sincronizarVista,30000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) sincronizarVista(); });
q("#hamburgerBtn").onclick=openDrawer;
q("#drawerBg").onclick=closeDrawer;
q("#bellBtn").onclick=function(){
  const alerts=computeAlerts();
  openModal(`<div class="modal-head"><h3>Alertas</h3><button class="modal-close" data-close-m>✕</button></div>
    <div class="modal-body">${alerts.length? alerts.map(a=>`<div class="alert-item"><span class="dot"></span><span class="txt">${esc(a.text)}</span><span class="cnt">${a.count}</span></div>`).join("") : `<div class="empty-alerts">Sin alertas activas.</div>`}</div>`);
  qa("[data-close-m]",q("#modalRoot")).forEach(b=>b.onclick=closeModal);
};
q("#globalSearch").addEventListener("input",debounce(e=>doGlobalSearch(e.target.value),200));
q("#searchResults").onclick=function(e){
  const item=e.target.closest("[data-goto]");
  if(item){ navigate(item.getAttribute("data-goto")); q("#globalSearch").value=""; q("#searchResults").classList.remove("show"); }
};
document.addEventListener("click",function(e){
  if(!e.target.closest(".searchbar") && !e.target.closest("#searchResults")) q("#searchResults").classList.remove("show");
});

})();
